<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conference Skills · Student Field Guide</title>
<meta name="description" content="คู่มือและงานมอบหมายสำหรับนิสิตที่ไปร่วมประชุมวิชาการ (ใช้ได้กับทุกงานประชุม) / Student guide & assignments for any academic conference.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f3; --surface:#ffffff; --ink:#34373d; --muted:#6c717a; --line:#ece5da;
  --accent:#3f7a70; --accent-2:#dff2ec; --warn:#9a5a36; --warn-bg:#fdece2; --info-bg:#e9f1fc; --info:#3d6189;
  --mint:#bfe5da; --mint-d:#9fd4c5; --lav:#e3dcf6; --lav-d:#6b5fa8; --pink:#fbe1e6; --sky:#dcecf8; --butter:#fdf3d0; --bar:#93cfbf;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.65;font-size:16px}
body.lang-th{font-family:"IBM Plex Sans Thai","Inter",system-ui,sans-serif}
a{color:var(--accent)}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em}
h2{font-size:1.45rem} h3{font-size:1.1rem} h4{font-size:1rem}
p{margin:.3em 0 .8em}
ul,ol{margin:.2em 0 .9em;padding-left:1.3em}
li{margin:.2em 0}
small,.muted{color:var(--muted)}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(251,248,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-size:1.05rem}
.brand span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:.3rem;background:#efe9f6;padding:.25rem;border-radius:999px}
.tabs button{border:0;background:transparent;padding:.45rem 1rem;border-radius:999px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:.4rem .8rem;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--lav);color:var(--lav-d)}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:1.2rem 1rem 4rem;display:grid;grid-template-columns:240px 1fr;gap:1.5rem}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.side a{display:block;padding:.35rem .7rem;border-radius:8px;text-decoration:none;color:var(--muted);font-size:.92rem}
.side a:hover{background:#f3eef9;color:var(--ink)}
.side a.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.side .sgroup{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--lav-d);font-weight:700;padding:.8rem .7rem .2rem}
.side .sgroup:first-child{padding-top:.2rem}
input[type=date]{font:inherit;font-size:.95rem;padding:.45rem .6rem;border:1px solid #cfccc3;border-radius:8px;width:100%}
.side .prog{margin:.8rem .7rem;font-size:.85rem}
main{min-width:0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem 1.5rem;margin-bottom:1.2rem;box-shadow:var(--shadow);scroll-margin-top:84px}
section.card.hero{background:linear-gradient(135deg,var(--accent-2) 0%,var(--lav) 55%,var(--pink) 100%);color:var(--ink);border:0}
.hero h1{font-size:1.8rem;margin-bottom:.3em}
.hero p{opacity:1}
.hero .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:.7rem;margin-top:1rem}
.hero .fact{background:rgba(255,255,255,.6);border-radius:10px;padding:.6rem .8rem;font-size:.9rem}
.hero .fact b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--lav-d)}
.hero a{color:var(--accent)}
.hero .eyebrow{color:var(--lav-d)!important}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:.2rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.box{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;background:#fffdf9}
.box h4{margin-bottom:.3em}
.note{background:var(--info-bg);border-left:4px solid #bcd5f2;color:var(--info);border-radius:10px;padding:.7rem 1rem;font-size:.93rem;margin:.6rem 0}
.warn{background:var(--warn-bg);border-left:4px solid #f6c9ad;color:var(--warn);border-radius:10px;padding:.7rem 1rem;font-size:.93rem;margin:.6rem 0}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:.1rem .55rem;border-radius:999px;background:var(--accent-2);color:var(--accent);margin-right:.3rem;white-space:nowrap}
.pill.gray{background:#efebe4;color:var(--muted)}
.pill.lav{background:var(--lav);color:var(--lav-d)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
/* checklist */
.check{list-style:none;padding:0;margin:.4rem 0 1rem}
.check li{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem .5rem;border-radius:8px}
.check li:hover{background:#f6f5f1}
.check input{margin-top:.35rem;width:18px;height:18px;accent-color:var(--accent);flex:none}
.check li.done span{color:var(--muted);text-decoration:line-through}
.bar{height:8px;background:#e8e6df;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:99px;transition:width .3s}
/* table */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .5rem;text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--lav-d);background:#f7f3fc}
.tblwrap{overflow-x:auto}
/* forms */
label.f{display:block;font-weight:600;font-size:.88rem;margin:.6rem 0 .2rem}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;font:inherit;font-size:.95rem;padding:.5rem .65rem;border:1px solid #cfccc3;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--mint-d);background:var(--mint);color:#24504a;font:inherit;font-weight:600;font-size:.9rem;padding:.45rem .9rem;border-radius:8px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border-color:var(--mint-d)}
.btn:hover{filter:brightness(.97)}
.btn.danger{background:#fff;color:#a8484f;border-color:#f1c4ca}
.btn.sm{font-size:.8rem;padding:.25rem .6rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 .9rem}
.item{border:1px solid var(--line);border-radius:12px;padding:.6rem 1rem 1rem;margin:.8rem 0;background:#fcfbf8;position:relative}
.item .del{position:absolute;top:.6rem;right:.6rem}
.item h4{margin:.3rem 0 .2rem;font-size:.95rem;color:var(--accent)}
.out{white-space:pre-wrap;background:#f3f2ed;border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;font-size:.92rem;margin:.6rem 0}
.score{display:flex;gap:.25rem}
.score button{width:32px;height:32px;border-radius:8px;border:1px solid #cfccc3;background:#fff;font:inherit;font-weight:600;cursor:pointer}
.score button.on{background:var(--mint);color:#24504a;border-color:var(--mint-d)}
.crit{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:center;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.crit small{display:block}
/* planner */
.day{margin:1rem 0}
.day h3{display:flex;gap:.5rem;align-items:center}
.slot{display:grid;grid-template-columns:120px 1fr;gap:.6rem;margin:.4rem 0;align-items:start}
.slot .t{font-size:.82rem;color:var(--muted);font-weight:600;padding-top:.35rem}
.blocks{display:flex;flex-wrap:wrap;gap:.4rem}
.blk{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.35rem .6rem;font-size:.82rem;cursor:pointer;text-align:left;font:inherit;font-size:.82rem;line-height:1.35;max-width:260px}
.blk b{display:block;font-size:.72rem;color:var(--muted)}
.blk.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.blk.on b{color:#d6efe8}
.blk.fixed{background:#f1efe9;cursor:default}
.blk.clash{outline:2px solid #d0782f}
/* assignments */
.asg{border-left:6px solid var(--mint)}
section.asg:nth-of-type(4n+3){border-left-color:var(--lav)}
section.asg:nth-of-type(4n){border-left-color:var(--pink)}
section.asg:nth-of-type(4n+1){border-left-color:var(--sky)}
.asg-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.asg-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin:.3rem 0 .6rem}
details.more{margin:.6rem 0}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:.8rem 0}
.stat{background:#fcfbf8;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.stat b{font-size:1.4rem;display:block;color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--lav);color:var(--lav-d);padding:.55rem 1rem;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.refs li{font-size:.88rem}
.hide{display:none!important}
@media (max-width:860px){
  .top{position:static}
  .tabs button{padding:.4rem .7rem;font-size:.85rem}
  .wrap{grid-template-columns:1fr}
  .side{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.5rem}
  .side .prog{width:100%}
  .side .sgroup{width:100%;padding:.4rem .3rem 0}
  .slot{grid-template-columns:1fr}
  .hero h1{font-size:1.4rem}
  section.card{padding:1.1rem}
}
@media print{
  .top,.side,.btn,.noprint{display:none!important}
  .wrap{display:block;padding:0}
  section.card{box-shadow:none;break-inside:avoid-page;border:0;padding:.5rem 0}
  body{background:#fff}
  body.pr #printReport{display:block!important}
  body.pr #app{display:none!important}
}
#printReport{display:none;white-space:pre-wrap;font-size:11pt}
</style>
</head>
<body class="lang-th">
<header class="top">
  <div class="top-in">
    <div class="brand"><b id="brandTitle">Conference Skills</b><span id="brandSub"></span></div>

      <button id="tabGuide" class="on" data-tab="guide"></button>
      <button id="tabAsg" data-tab="asg"></button>
    </nav>

      <button data-lang="th" class="on">ไทย</button>
      <button data-lang="en">EN</button>

</header>
<div id="app" class="wrap">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<div id="printReport"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== General conference guide — data & sections (part 1) ===== */
const SRC = {
  leininger:"https://doi.org/10.1371/journal.pcbi.1009133",
  erren:"https://pmc.ncbi.nlm.nih.gov/articles/PMC1876493/",
  bourne:"https://doi.org/10.1371/journal.pcbi.0030077",
  bautista:"https://pmc.ncbi.nlm.nih.gov/articles/PMC9223317/",
  tca:"https://thinkcheckattend.org/check/",
  canterbury:"https://www.canterbury.ac.nz/content/dam/uoc-main-site/documents/faculties/science/biological-sciences/abc/How%20to%20write%20a%20conference%20abstract.pdf",
  temple:"https://guides.temple.edu/c.php?g=1320941&p=9717586",
  iu:"https://blogs.iu.edu/grademissaries/2023/09/28/conference-101-how-to-maximize-your-conference-attendance-as-a-graduate-or-professional-student/",
  cub:"https://www.colorado.edu/graduateschool/services-resources/career-resources/guide-academic-networking",
  unimelb:"https://students.unimelb.edu.au/academic-skills/graduate-research-services/developing-your-networking-and-presentation-skills/networking-at-academic-events",
  compass:"https://www.compassscicomm.org/navigating-conferences-as-early-career-scientists/"
};
const cite = (k,label) => `<a href="${SRC[k]}" target="_blank" class="cite">${label}</a>`;

const UI = {
  tabGuide:{th:"ส่วนที่ 1 · คู่มือแนะนำ",en:"Part 1 · Guide"},
  tabAsg:{th:"ส่วนที่ 2 · งานมอบหมาย",en:"Part 2 · Assignments"},
  brandTitle:{th:"ทักษะการไปประชุมวิชาการ",en:"Conference Skills"},
  brandSub:{th:"คู่มือนิสิต · ใช้ได้กับทุกงานประชุม",en:"Student field guide · for any conference"},
  progress:{th:"ความคืบหน้า checklist",en:"Checklist progress"},
  asgProgress:{th:"ความคืบหน้างาน",en:"Assignment progress"},
  copy:{th:"คัดลอก",en:"Copy"}, copied:{th:"คัดลอกแล้ว",en:"Copied"},
  add:{th:"+ เพิ่มรายการ",en:"+ Add entry"}, del:{th:"ลบ",en:"Remove"},
  total:{th:"รวม",en:"Total"}
};

const GROUPS = {
  start:{th:"เริ่มต้น",en:"Start here"},
  plan:{th:"1 · วางแผนและเลือกงาน",en:"1 · Plan & choose"},
  submit:{th:"2 · เตรียมและส่งผลงาน",en:"2 · Prepare & submit"},
  pre:{th:"3 · เตรียมตัวก่อนไป",en:"3 · Get ready"},
  at:{th:"4 · ระหว่างงาน",en:"4 · At the conference"},
  post:{th:"5 · หลังงาน",en:"5 · Afterwards"}
};

/* ---------- Checklists ---------- */
const CHECK = {
  submit:[
    {th:"อ่าน Call for Papers และคำแนะนำผู้เขียนทั้งหมดจนจบ",en:"Read the entire Call for Papers and author guidelines"},
    {th:"เขียนใน template ทางการของงานตั้งแต่เริ่ม",en:"Write inside the official template from the start"},
    {th:"ความยาวไม่เกินกำหนด (คำ/หน้า) และตรวจว่านับรวมชื่อเรื่อง/ผู้แต่ง/รูปหรือไม่",en:"Within the word/page limit — and checked what counts toward it"},
    {th:"มีครบทุกหัวข้อที่กำหนด เรียงตาม template",en:"All required sections present, in the template's order"},
    {th:"รายชื่อผู้แต่งครบ ไม่ตกหล่นใคร (โดยเฉพาะอาจารย์ที่ปรึกษา) ตัวยกสังกัดและอีเมล corresponding author ถูกต้องและตรงกันทุกไฟล์",en:"Author list complete — no one missing (especially the advisor); superscript affiliations and corresponding email correct and consistent"},
    {th:"ผู้ร่วมวิจัยทุกคนและอาจารย์ที่ปรึกษาอนุมัติฉบับสุดท้ายแล้ว",en:"All co-authors and the advisor approved the final version"},
    {th:"รูป/ตารางมีหมายเลข คำบรรยาย หน่วย อ่านออก และถูกอ้างถึงในเนื้อหา",en:"Figures/tables numbered, captioned, with units, legible and cited in the text"},
    {th:"เอกสารอ้างอิงครบและใช้รูปแบบเดียวตามที่กำหนด",en:"References complete, in the single required style"},
    {th:"ตรวจภาษา (เครื่องมือ + คนอ่านทาน)",en:"Language checked (tool + human proofreader)"},
    {th:"ตรวจความซ้ำ/คัดลอก และไม่ใช้เนื้อหาที่ตีพิมพ์แล้ว",en:"Similarity check done; no previously published content"},
    {th:"ถ้าใช้ AI ช่วย ทำตามนโยบายของงานและตรวจทุกข้อความด้วยตัวเอง",en:"If AI helped, follow the conference policy and verify every statement"},
    {th:"ไฟล์ครบตามรูปแบบที่กำหนด (เช่น .docx + .pdf) ตั้งชื่อตามที่งานกำหนด หรือ YYYYMMDD_ชื่อสื่อความหมาย_a (ไม่ใช้ \"final\")",en:"Files in the required formats (e.g. .docx + .pdf), named as the conference requires or YYYYMMDD_DescriptiveName_a (never \"final\")"},
    {th:"เลือกหัวข้อ/session และรูปแบบการนำเสนอถูกต้อง",en:"Correct topic/session and presentation preference selected"},
    {th:"ส่งก่อนกำหนด 2–3 วัน และเก็บหลักฐานการส่ง",en:"Submitted 2–3 days early; proof of submission saved"},
    {th:"ลงปฏิทิน: วันแจ้งผล วันส่งแก้ไข วันลงทะเบียน early-bird",en:"Calendar: decision, correction and early-bird dates"}
  ],
  before:[
    {th:"ยืนยันการลงทะเบียนและรหัสผลงาน/เวลานำเสนอของตัวเอง",en:"Confirm registration and your presentation code/slot"},
    {th:"ดาวน์โหลดโปรแกรม/abstract book หรือแอปของงาน ใช้แบบออฟไลน์ได้",en:"Download the program/abstract book or conference app for offline use"},
    {th:"เขียนเป้าหมาย 3 ข้อ: เรียนรู้อะไร ขอ feedback อะไร อยากรู้จักใคร",en:"Write 3 goals: what to learn, what feedback to seek, whom to meet"},
    {th:"อ่าน abstract ที่เกี่ยวข้องอย่างน้อย 5 เรื่อง",en:"Read at least 5 relevant abstracts"},
    {th:"วางตารางส่วนตัวด้วย Planner พร้อมแผนสำรอง",en:"Build your schedule in the Planner, with backups"},
    {th:"ระบุคนที่อยากคุยด้วย 5–8 คน และอ่านงานของเขา",en:"List 5–8 people to meet and read their work"},
    {th:"เตรียมคำถามล่วงหน้าอย่างน้อย 3 ข้อ",en:"Prepare at least 3 questions"},
    {th:"ฝึก elevator pitch 30 วินาที และ 90 วินาที (ไทย/อังกฤษ)",en:"Practise 30 s and 90 s elevator pitches (Thai/English)"},
    {th:"อัปเดต LinkedIn / ResearchGate / ORCID และทำ QR code โปรไฟล์",en:"Update LinkedIn / ResearchGate / ORCID; make a profile QR code"},
    {th:"อ่าน code of conduct ของงาน และรู้ช่องทางแจ้งเหตุ",en:"Read the code of conduct and know how to report problems"},
    {th:"ตรวจการเดินทาง ที่พัก และแผนผังสถานที่",en:"Check travel, accommodation and the venue map"},
    {th:"แจ้งแผนและเบอร์ติดต่อฉุกเฉินให้อาจารย์ที่ปรึกษา",en:"Share your plan and emergency contact with your advisor"}
  ],
  packing:[
    {th:"บัตรนักศึกษา/บัตรประชาชน หลักฐานลงทะเบียน",en:"Student/ID card and registration proof"},
    {th:"สมุดโน้ต ปากกา (หรือแท็บเล็ต)",en:"Notebook and pens (or tablet)"},
    {th:"พาวเวอร์แบงก์ สายชาร์จ หัวแปลงปลั๊ก (ถ้าไปต่างประเทศ)",en:"Power bank, cables, plug adapter (if abroad)"},
    {th:"ไฟล์นำเสนอสำรอง 3 ที่: USB, cloud, อีเมล (PPTX + PDF ฝังฟอนต์)",en:"Talk backups in 3 places: USB, cloud, email (PPTX + PDF, fonts embedded)"},

`<div class="eyebrow">พื้นฐาน</div><h2>งานประชุมวิชาการมีอะไรบ้าง</h2>

<tr><td><b>Oral (contributed) session</b></td><td>หลายห้องคู่ขนาน มักคนละ 10–20 นาทีรวมถามตอบ (เช่น 12+3 หรือ 15+5)</td><td>ผลงานใหม่ ฝึกถามคำถาม</td></tr>

`<div class="eyebrow">ขั้นที่ 1 · วางแผน</div><h2>หลักการ: เริ่มก่อนวันงานหลายเดือน</h2>
<p>งานประชุมส่วนใหญ่ปิดรับผลงาน <b>3–6 เดือนก่อนวันงาน</b> (งานนานาชาติขนาดใหญ่อาจเร็วกว่านั้น) และทุนเดินทางบางแหล่งมีกำหนดยื่นล่วงหน้าหลายเดือน (${cite("leininger","Leininger et al., 2021")}) ไทม์ไลน์ทั่วไป:</p>
<div class="tblwrap"><table><thead><tr><th>ก่อนวันงาน</th><th>สิ่งที่ควรทำ</th></tr></thead><tbody>
<tr><td>9–6 เดือน</td><td>ตั้งเป้าหมาย เลือกงาน คุยกับอาจารย์ หาทุนและตรวจกำหนดยื่นทุน</td></tr>
<tr><td>6–4 เดือน</td><td>อ่าน Call for Papers ดาวน์โหลด template สรุปผลและทำรูปหลัก</td></tr>
<tr><td>4–3 เดือน</td><td>เขียน ส่งอาจารย์ตรวจ และส่งผลงานก่อนกำหนด</td></tr>
<tr><td>3–2 เดือน</td><td>รอผลพิจารณา แก้ไขตามความเห็นผู้ประเมิน</td></tr>
<tr><td>2–1 เดือน</td><td>ลงทะเบียน (early-bird) ขออนุมัติเดินทาง จองที่พัก</td></tr>
<tr><td>1 เดือน – 1 สัปดาห์</td><td>ทำโปสเตอร์/สไลด์ ซ้อม วางตารางเข้าฟัง</td></tr>
<tr><td>วันงาน</td><td>นำเสนอ ฟัง สร้างเครือข่าย</td></tr>
<tr><td>หลังงาน 1–2 สัปดาห์</td><td>follow-up สรุปรายงาน เบิกจ่าย แบ่งปันกับแล็บ</td></tr>
</tbody></table></div>
<div class="warn">อย่าวางแผนโดยหวังว่าจะมีการขยายกำหนดส่ง — บางงานขยาย บางงานไม่ขยาย</div>
<h3>🧮 วางแผนย้อนหลังจากกำหนดส่ง</h3>{{w:timeline}}`,
`<div class="eyebrow">Stage 1 · Plan</div><h2>Principle: start months ahead</h2>
<p>Most conferences close submissions <b>3–6 months before the event</b> (large international meetings may be earlier), and some travel grants have deadlines months ahead (${cite("leininger","Leininger et al., 2021")}). A typical timeline:</p>
<div class="tblwrap"><table><thead><tr><th>Before the event</th><th>What to do</th></tr></thead><tbody>
<tr><td>9–6 months</td><td>Set goals, choose the meeting, talk to your advisor, find funding and its deadlines</td></tr>
<tr><td>6–4 months</td><td>Read the Call for Papers, download the template, finalise results and key figures</td></tr>
<tr><td>4–3 months</td><td>Write, get advisor feedback, submit before the deadline</td></tr>
<tr><td>3–2 months</td><td>Await review; revise per reviewer comments</td></tr>
<tr><td>2–1 months</td><td>Register (early-bird), request travel approval, book accommodation</td></tr>
<tr><td>1 month – 1 week</td><td>Make the poster/slides, rehearse, plan your schedule</td></tr>
<tr><td>Conference</td><td>Present, listen, network</td></tr>
<tr><td>1–2 weeks after</td><td>Follow up, write the report, claim expenses, share with your lab</td></tr>
</tbody></table></div>
<div class="warn">Never plan around a deadline extension — some meetings extend, many don't.</div>
<h3>🧮 Plan backwards from the deadline</h3>{{w:timeline}}`);

`<div class="eyebrow">ขั้นที่ 1 · เลือกงาน</div><h2>หางานประชุมที่เหมาะสม</h2>
<p>เริ่มจาก <b>เป้าหมาย</b> — อยากเรียนรู้ ได้ feedback สร้างเครือข่าย หรือพัฒนาวิชาชีพ — แล้วเลือกงานที่ตอบเป้าหมายนั้น งานขนาดเล็กเอื้อต่อการคุยแบบไม่เป็นทางการ งานขนาดใหญ่ให้ภาพรวมของสาขา งานออนไลน์มักถูกกว่าและเข้าถึงง่าย (${cite("leininger","Leininger et al., 2021")})</p>
<div class="grid2">
<div class="box"><h4>🔎 หางานจากที่ไหน</h4><ul>
<li>อาจารย์ที่ปรึกษาและรุ่นพี่ในแล็บ</li>
<li>สมาคมวิชาชีพ/สมาคมวิทยาศาสตร์ในสาขา (ประชุมประจำปี)</li>
<li>ประกาศคณะ/มหาวิทยาลัย และ mailing list ของสาขา</li>
<li>ดูว่านักวิจัยที่เราอ่านงานบ่อย ๆ ไปนำเสนอที่ไหน</li>
<li>ระวังอีเมลเชิญชวนที่ส่งมาโดยไม่รู้จักกัน</li></ul></div>
<div class="box"><h4>🧭 ประเภทงาน</h4><ul>
<li><b>ประชุมระดับชาติ/สมาคม</b> — หลายสาขา เหมาะกับนำเสนอครั้งแรก</li>
<li><b>ประชุมนานาชาติเฉพาะสาขา</b> — ผู้เชี่ยวชาญตรงสาย แข่งขันสูง ค่าใช้จ่ายสูง</li>
<li><b>Student / young scientist symposium</b> — เป็นกันเอง ได้ feedback</li>
<li><b>Workshop / training</b> — ทักษะเชิงปฏิบัติ</li>
<li><b>Virtual / hybrid</b> — ประหยัด เข้าถึงง่าย แต่ต้องตั้งใจสร้างเครือข่ายมากขึ้น</li></ul></div>
</div>
<h3>เกณฑ์เลือกงาน</h3>
<ul>
<li><b>ขอบเขตตรงกับงาน</b> — มี session/symposium ตรงหัวข้อ</li>
<li><b>ผู้ฟังและเครือข่าย</b> — คนที่อยากรู้จักไปหรือไม่ keynote เป็นใคร</li>
<li><b>ผู้จัดน่าเชื่อถือ</b> — สมาคม/มหาวิทยาลัยที่รู้จัก จัดต่อเนื่อง</li>
<li><b>ช่องทางตีพิมพ์</b> — abstract book, proceedings หรือวารสาร; ฐานข้อมูลที่ indexing; ผลต่อการตีพิมพ์วารสารภายหลัง</li>

<h3>🧪 ประเมินงานประชุมที่สนใจ</h3>{{w:confcheck}}`,
`<div class="eyebrow">Stage 1 · Choose</div><h2>Finding the right conference</h2>
<p>Start from your <b>goal</b> — learning, feedback, networking or professional development — and pick a meeting that serves it. Small meetings favour informal networking, large ones give a field overview, and virtual events are often cheaper and easier to join (${cite("leininger","Leininger et al., 2021")}).</p>
<div class="grid2">
<div class="box"><h4>🔎 Where to look</h4><ul>
<li>Your advisor and senior lab members</li>
<li>Professional/scientific societies in your field (annual meetings)</li>
<li>Faculty/university announcements and field mailing lists</li>
<li>Where researchers you often read present their work</li>
<li>Be wary of unsolicited email invitations</li></ul></div>
<div class="box"><h4>🧭 Types of meeting</h4><ul>
<li><b>National/society congress</b> — multidisciplinary, good for a first presentation</li>
<li><b>Specialised international conference</b> — niche experts, competitive, costly</li>
<li><b>Student / young-scientist symposium</b> — friendly, good feedback</li>
<li><b>Workshop / training</b> — hands-on skills</li>
<li><b>Virtual / hybrid</b> — affordable and accessible, but networking takes more effort</li></ul></div>
</div>
<h3>Selection criteria</h3>
<ul>
<li><b>Scope fit</b> — sessions/symposia that match your topic</li>
<li><b>Audience & network</b> — will the people you want to meet attend? Who are the keynotes?</li>
<li><b>Credible organiser</b> — a known society/university, a long-running series</li>
<li><b>Publication outlet</b> — abstract book, proceedings or journal; indexing; effect on later journal publication</li>
<li><b>Cost & funding</b> — registration (students often get reduced rates) + travel + accommodation</li>
<li><b>Timing</b> — will results be ready? Clashes with exams/fieldwork?</li>
<li><b>Student opportunities</b> — awards, travel grants, mentoring</li>
</ul>
<div class="warn"><b>Beware of predatory conferences:</b> names mimicking famous meetings, any topic accepted, spam invitations, no committee listed, suspiciously fast acceptance, no stated publication outlet, vague fees — check with ${cite("tca","Think. Check. Attend.")}</div>
<h3>🧪 Evaluate a conference you are considering</h3>{{w:confcheck}}`);

`<div class="eyebrow">Stage 2 · Abstract</div><h2>Writing the abstract</h2>
<p>The abstract is the "advertisement" for your work: reviewers use it to accept or reject, and attendees to choose your room. It must stand on its own (${cite("canterbury","Univ. of Canterbury")}; ${cite("temple","Temple Univ. Libraries")}).</p>
<h3>Header: authors, affiliations and keywords</h3>
<div class="grid2">
<div class="box"><h4>👥 Authors / Affiliation</h4><ul>
<li>Follow the template: <b>author order</b>, name format, <b>superscript affiliation numbers</b> after names, and an * marking the <b>corresponding author</b> with email</li>
<li>Write affiliations in full and consistently across outputs: department, faculty, university, city, country</li>
<li>Mark the presenting author if required (e.g. underline)</li>
<li>Agree on author order and the corresponding author (often the advisor) before writing</li></ul>
<div class="warn" style="margin-bottom:0">⚠️ <b>Never leave anyone out — especially your advisor.</b> Every co-author who contributed substantially must be listed, with correct spelling and affiliation, and everyone must approve the final version. Author lists are often hard or impossible to change after submission.</div></div>
<div class="box"><h4>🔑 Keywords</h4><ul>
<li>As many as the conference asks (often 3–6 words/phrases)</li>
<li><b>Don't repeat words from the title</b> — the title is already searchable, so different keywords add new search terms and increase your work's visibility</li>
<li>Use terms people in your field actually search: techniques, organisms, study areas, synonyms</li>
<li>Example title "Soil eDNA reveals higher arthropod diversity…"<br>✗ <i>soil eDNA; arthropod diversity</i> (repeats the title)<br>✓ <i>metabarcoding; mitochondrial COI; land-use change; Hill numbers</i></li></ul></div>
</div>
<p class="muted">Example header layout (fictional):</p><pre class="out" style="font-size:.85rem">Soil eDNA reveals higher arthropod diversity in community forests …
A. Student¹, B. Colleague², <u>C. Advisor</u>¹*
¹Department of Biology, Faculty of Science, University X, City, Country
²Department of Soil Science, University Y, City, Country
*Corresponding author: c.advisor@univx.ac.th</pre>
<h3>Five-part structure (example shares for ~200–250 words)</h3>
<div class="tblwrap"><table><thead><tr><th>Part</th><th>Approx.</th><th>What to write</th></tr></thead><tbody>
<tr><td>1. Background</td><td>1–2 sentences · ~15%</td><td>Context, problem, knowledge gap</td></tr>
<tr><td>2. Aim / hypothesis</td><td>1 sentence · ~10%</td><td>A clear objective or hypothesis</td></tr>
<tr><td>3. Methods</td><td>2–3 sentences · ~25%</td><td>Samples/site, numbers, key methods, analysis (essentials)</td></tr>
<tr><td>4. Results</td><td>2–3 sentences · ~35%</td><td>Key findings <b>with numbers</b> — never "results will be presented"</td></tr>
<tr><td>5. Conclusion</td><td>1–2 sentences · ~15%</td><td>Meaning, applications, next steps — don't overclaim</td></tr>
</tbody></table></div>
<div class="grid2">
<div class="box"><h4>✅ Do</h4><ul>
<li>Finish the abstract first, then write a ~10–15-word title saying what you studied</li>
<li>Past tense for methods/results · present tense for facts and conclusions</li>
<li>Define acronyms at first use; italicise scientific names</li>
<li>For blind review, remove names of people/institutions</li>
<li>Have your advisor and a friend from another field read it</li></ul></div>
<div class="box"><h4>⛔ Don't</h4><ul>
<li>Exceed the word limit (may mean instant rejection)</li>
<li>Include references, jargon or undefined acronyms</li>
<li>Over-detail methods so results get squeezed — or under-describe them so reviewers can't judge</li>
<li>Write vague results such as "results will be discussed"</li>
<li>Overclaim, or use empty titles like "Effect of…"</li></ul></div>
</div>
<h3>✏️ Abstract builder & word counter</h3>{{w:abstract}}`);

`<div class="eyebrow">ขั้นที่ 2 · บทความฉบับเต็ม</div><h2>เขียนบทความฉบับเต็ม (Full paper / Proceedings)</h2>
<p>บทความฉบับเต็มสำหรับ proceedings คือบทความวิจัยขนาดสั้น ใช้โครงสร้าง IMRaD และ <b>เขียนใน template ทางการตั้งแต่เริ่ม</b> เพื่อเห็นจำนวนหน้าจริงตลอดเวลา</p>
<div class="tblwrap"><table><thead><tr><th>หัวข้อ</th><th>หลักการ</th></tr></thead><tbody>

<tr><td>Results and Discussion</td><td>เล่าตามรูป/ตาราง เปรียบเทียบกับงานอื่น อธิบายเหตุผล ระบุข้อจำกัด</td></tr>

<div class="grid2">

<h3>ลำดับการเขียนที่แนะนำ</h3>

`<div class="eyebrow">Stage 2 · Full paper</div><h2>Writing the full paper (proceedings)</h2>
<p>A proceedings paper is a short research article. Use IMRaD and <b>write inside the official template from the start</b> so you always see the real page count.</p>
<div class="tblwrap"><table><thead><tr><th>Section</th><th>Principles</th></tr></thead><tbody>
<tr><td>Title / Authors / Affiliation</td><td>Per template: author order, superscript affiliations, corresponding email</td></tr>
<tr><td>Abstract + Keywords</td><td>As in the previous section</td></tr>
<tr><td>Introduction</td><td>Funnel: importance → what is known (cited) → gap → objectives</td></tr>
<tr><td>Methods</td><td>Replicable detail: samples, site, instruments (model/maker), statistics, permits/ethics</td></tr>
<tr><td>Results and Discussion</td><td>Lead with figures/tables, compare with others, explain, state limitations</td></tr>
<tr><td>Conclusion</td><td>Answer each objective; no new data</td></tr>
<tr><td>Acknowledgements</td><td>Funding (grant numbers), helpers, facilities and site access</td></tr>
<tr><td>References</td><td>One style per template; every citation listed and vice versa (Zotero/EndNote/Mendeley)</td></tr>
</tbody></table></div>
<div class="grid2">
<div class="box"><h4>📊 Figures & tables</h4><ul>
<li>Numbered with self-explanatory captions</li>
<li>≥300 dpi, legible when printed, units and error bars</li>
<li>Cited in the text before they appear</li>
<li>Don't duplicate data in a figure and a table</li></ul></div>
<div class="box"><h4>⚠️ Watch out</h4><ul>
<li><b>Originality:</b> no previously published content, including your own</li>
<li><b>Later journal publication:</b> some journals treat a proceedings full paper as prior publication — ask your advisor whether to submit only an abstract</li>
<li><b>Authorship:</b> agree on order early; everyone approves before submission</li>
<li><b>AI:</b> follow the conference policy; authors own every sentence and citation</li></ul></div>
</div>
<h3>Recommended order</h3>
<ol><li>Make the key figures and tables first</li><li>Methods → Results & Discussion → Conclusion → Introduction → Abstract → Title</li><li>At least two advisor review rounds (~1 week each), naming each round's file with a date (see "Submitting")</li><li>Check language, similarity and references</li><li>Export to PDF and check again (fonts, equations, figures, page count)</li></ol>`);

`<div class="eyebrow">Stage 2 · Submit</div><h2>Check before you submit, then handle the review</h2>
<h3>🗂️ File naming</h3>
<div class="grid2">
<div class="box"><h4>Principles</h4><ol>
<li><b>If the conference specifies a file-name format, follow it exactly</b> (e.g. paperID_surname)</li>
<li>If not, use a <b>descriptive name + date as YYYYMMDD + sequence _a _b _c</b> (or v1 v2) — files sort by time, the latest is obvious, and recipients know what and whose it is</li>
<li>No spaces (use _ or -); avoid special characters / \ : * ? " &lt; &gt; | and non-Latin characters in files for online systems (some display them wrongly)</li>
<li>For files someone commented on, add the reviewer's initials, e.g. <code>_PDcmt</code>; the revision gets a new date</li></ol></div>
<div class="box"><h4>Examples</h4>
<p>❌ <code>abstract final.docx</code> · <code>final1.docx</code> · <code>final2_new.docx</code> · <code>abstract REALLY final.docx</code><br><small class="muted">"final" is rarely final and says nothing about order or date</small></p>
<p>✅ <code>20270115_Abstract_SoilEDNA_Jaidee_a.docx</code><br>✅ <code>20270115_Abstract_SoilEDNA_Jaidee_b.docx</code> (same-day revision)<br>✅ <code>20270118_Abstract_SoilEDNA_Jaidee_a_PDcmt.docx</code><br>✅ <code>ICB2027_P012_Jaidee.pdf</code> (as required by the conference)</p></div>
</div>
<h4>File-name builder</h4>{{w:fname}}
<h3>Pre-submission checklist</h3>{{w:check:submit}}
<div class="grid2">
<div class="box"><h4>📨 When the decision arrives</h4><ul>
<li>Read every comment; read once, step away, then revise</li>
<li>Make a "comment – change – location" table for your advisor</li>
<li>Revise fully and resubmit on time</li>
<li>If you disagree, reply politely with reasons and evidence</li>
<li>If rejected: ask for feedback, improve, find the next meeting</li></ul></div>
<div class="box"><h4>🧾 After acceptance</h4><ul>
<li>Register and pay before early-bird closes</li>
<li>Request travel approval/funding; book travel; keep receipts</li>
<li>Read the presentation guidelines: talk length, poster size, language, mounting time</li>

S_("present","pre",{th:"เตรียมการนำเสนอ",en:"Preparing your presentation"},
`<div class="eyebrow">ขั้นที่ 3 · การนำเสนอ</div><h2>เตรียมการนำเสนอ (บรรยาย / โปสเตอร์)</h2>
<p>อ่าน presentation guidelines ของงานก่อนเสมอ: เวลาพูด ภาษา ขนาดและแนวโปสเตอร์ เวลาติด/เก็บโปสเตอร์ ชนิดไฟล์ และกำหนดส่งไฟล์</p>
<div class="grid2">
<div class="box"><h4>📽️ บรรยาย — 10 หลักของ ${cite("bourne","Bourne (2007)")}</h4><ol>
<li>พูดให้เหมาะกับผู้ฟัง</li><li>น้อยแต่ชัด (less is more)</li><li>พูดเมื่อมีสิ่งที่ควรพูด</li><li>ข้อความหลักต้องจำได้แม้ผ่านไปหนึ่งสัปดาห์</li><li>เล่าอย่างมีตรรกะเหมือนเรื่องเล่า</li><li>ใช้เวทีอย่างเป็นธรรมชาติในสไตล์ตัวเอง</li><li>ซ้อมและจับเวลา</li><li>ใช้ภาพน้อยแต่ได้ผล อย่าอ่านสไลด์</li><li>อัดเสียง/วิดีโอตัวเองแล้วดูเพื่อแก้นิสัย</li><li>ให้เครดิตผู้ร่วมงานอย่างเหมาะสม</li></ol>
<p class="muted">เคล็ดลับ: ~1 สไลด์/นาที ใส่ข้อสรุปเป็นหัวสไลด์ เตรียม backup slides ฝังฟอนต์หรือใช้ PDF</p></div>
<div class="box"><h4>🖼️ โปสเตอร์ — จาก ${cite("erren","Erren & Bourne (2007)")}</h4><ul>
<li>กำหนดจุดประสงค์ อยากให้ผู้อ่านทำอะไรต่อ</li><li>ขายงานให้ได้ใน 10 วินาที ชื่อเรื่องสั้นเหมือนพาดหัว</li><li>จัดวางให้มีเส้นทางการอ่านและพื้นที่ว่าง อ่านได้จากระยะ 1–2 เมตร</li><li>ข้อความกระชับ ภาพ/กราฟเป็นตัวเล่า ข้อสรุปเด่น</li><li>ใส่ความเป็นตัวเอง (รูปผู้เขียน) เพื่อชวนคุย</li><li>มี QR code/handout เพื่อติดต่อภายหลัง</li></ul>
<p class="muted">เตรียมเล่า 3 ระดับ: 30 วินาที / 2 นาที / 5 นาที · ยืนประจำโปสเตอร์ตลอดเวลาที่กำหนด</p></div>
</div>
<h3>การตอบคำถาม</h3>
<ul><li>ฟังจนจบ ทวนคำถามให้ผู้ฟังทั้งห้องได้ยิน</li><li>ตอบตรง สั้น อ้างข้อมูล ถ้าไม่รู้ให้บอกตรง ๆ และเสนอคุยต่อหลัง session</li><li>จดคำถามและ feedback ทุกข้อ — คือวัตถุดิบพัฒนางาน</li></ul>
<div class="note">ซ้อมอย่างน้อย 2 รอบ (หนึ่งรอบต่อหน้าแล็บ) ก่อนวันงาน 1–2 สัปดาห์ และตรวจข้อกำหนดของงานอีกครั้งก่อนสั่งพิมพ์โปสเตอร์</div>`,
`<div class="eyebrow">Stage 3 · Presentation</div><h2>Preparing your talk or poster</h2>
<p>Always read the presentation guidelines first: talk length, language, poster size/orientation, mounting/removal times, file types and upload deadlines.</p>
<div class="grid2">
<div class="box"><h4>📽️ Talks — 10 rules from ${cite("bourne","Bourne (2007)")}</h4><ol>
<li>Talk to the audience</li><li>Less is more</li><li>Only talk when you have something to say</li><li>Make the take-home message stick for a week</li><li>Be logical — tell a story</li><li>Treat the floor as a stage, in your own style</li><li>Practise and time it</li><li>Use visuals sparingly but effectively; don't read slides</li><li>Review recordings of yourself to fix habits</li><li>Give appropriate acknowledgements</li></ol>
<p class="muted">Tips: ~1 slide per minute; conclusions as slide titles; backup slides; embed fonts or use PDF.</p></div>
<div class="box"><h4>🖼️ Posters — from ${cite("erren","Erren & Bourne (2007)")}</h4><ul>
<li>Define the purpose — what should viewers do next?</li><li>Sell the work in 10 seconds; headline-style title</li><li>Layout with a clear reading path and white space; legible at 1–2 m</li><li>Concise text, figures tell the story, prominent conclusions</li><li>Add personality (author photo) to invite conversation</li><li>QR code/handouts so people can follow up</li></ul>
<p class="muted">Prepare 30 s / 2 min / 5 min versions · stay at your poster for the whole slot.</p></div>
</div>
<h3>Handling questions</h3>
<ul><li>Listen fully; repeat the question for the room</li><li>Answer briefly and directly with evidence; if you don't know, say so and offer to talk afterwards</li><li>Write down every question and comment — they're material for improving your work</li></ul>
<div class="note">Rehearse at least twice (once in front of your lab) 1–2 weeks before, and re-check the rules before printing your poster.</div>`);

/* ---------- Stage 4: At the conference ---------- */
S_("listen","at",{th:"ฟัง จดโน้ต และถาม",en:"Listen, note, ask"},
`<div class="eyebrow">ขั้นที่ 4 · ฟัง</div><h2>ฟังให้ได้เนื้อ จดให้ได้ใช้ ถามให้ได้คุย</h2>
<div class="grid2">
<div class="box"><h4>📝 โครงโน้ต 4 ช่อง</h4><ol><li><b>Key message</b> — ประโยคเดียว</li><li><b>Method / evidence</b></li><li><b>Takeaway</b> — นำมาใช้กับงานเราได้อย่างไร</li><li><b>Question</b> — สิ่งที่ยังสงสัย</li></ol><p class="muted">จดทั้งไอเดียและชื่อคนที่ควรติดต่อ (${cite("leininger","Leininger et al., 2021")})</p></div>
<div class="box"><h4>❓ ถามให้ดี</h4><ul><li>ขอบคุณ แนะนำตัวสั้น ๆ</li><li>ถามข้อเดียว ชัด ไม่เกิน 20 วินาที</li><li>ถามเพื่อเข้าใจ/ต่อยอด ไม่ใช่เพื่อโชว์</li><li>ไม่ทันเวลา → ไปคุยต่อหลัง session</li></ul></div>
</div>
<h3>ตัวอย่างประโยคถาม</h3>
<ul><li>"Thank you for the talk. You mentioned ___ — could you say more about how you ___?"</li><li>"How sensitive are your results to ___? Did you try ___?"</li><li>"Your work reminds me of ___. Could the approach apply to ___?"</li><li>"What was the biggest practical challenge in ___?"</li></ul>
<p class="muted">ประโยคเปิดคำถามดัดแปลงจาก ${cite("unimelb","Univ. of Melbourne Academic Skills")}</p>`,
`<div class="eyebrow">Stage 4 · Listen</div><h2>Listen well, take usable notes, ask good questions</h2>
<div class="grid2">
<div class="box"><h4>📝 Four-box notes</h4><ol><li><b>Key message</b> — one sentence</li><li><b>Method / evidence</b></li><li><b>Takeaway</b> — use for my work</li><li><b>Question</b> — what's unclear</li></ol><p class="muted">Record ideas and people worth contacting (${cite("leininger","Leininger et al., 2021")}).</p></div>
<div class="box"><h4>❓ Asking well</h4><ul><li>Thank the speaker; introduce yourself briefly</li><li>One clear question, under 20 seconds</li><li>Ask to understand or extend, not to show off</li><li>Out of time → talk after the session</li></ul></div>
</div>
<h3>Question starters</h3>
<ul><li>"Thank you for the talk. You mentioned ___ — could you say more about how you ___?"</li><li>"How sensitive are your results to ___? Did you try ___?"</li><li>"Your work reminds me of ___. Could the approach apply to ___?"</li><li>"What was the biggest practical challenge in ___?"</li></ul>
<p class="muted">Starters adapted from ${cite("unimelb","Univ. of Melbourne Academic Skills")}.</p>`);

S_("posters","at",{th:"ดูโปสเตอร์ที่ดี",en:"Reviewing posters"},
`<div class="eyebrow">ขั้นที่ 4 · โปสเตอร์</div><h2>ดูโปสเตอร์อย่างนักวิจัย</h2>
<p>รอบแรกเดินเร็ว (10 วินาที/แผ่น — เข้าใจไหมว่าเกี่ยวกับอะไร) แล้วกลับไปคุยกับเจ้าของงานในแผ่นที่น่าสนใจ ("Could you walk me through your poster?") และเยี่ยมโปสเตอร์ของนิสิตรุ่นเดียวกันด้วย (${cite("compass","COMPASS, 2021")})</p>
<h3>เกณฑ์โปสเตอร์ที่ดี (ลองให้คะแนน)</h3>{{w:rubric}}`,
`<div class="eyebrow">Stage 4 · Posters</div><h2>Review posters like a researcher</h2>
<p>Do a quick first pass (10 s per poster — can you tell what it's about?), then return to the best ones and ask for a walkthrough ("Could you walk me through your poster?"). Visit peers' posters too (${cite("compass","COMPASS, 2021")}).</p>
<h3>What makes a good poster (try scoring one)</h3>{{w:rubric}}`);

S_("network","at",{th:"สร้างเครือข่าย",en:"Networking"},
`<div class="eyebrow">ขั้นที่ 4 · เครือข่าย</div><h2>สร้างเครือข่าย: เป้าหมาย 5 คนใหม่</h2>
<p>เป้าหมายคือ <b>บทสนทนาที่มีความหมาย 5 ครั้ง</b> ที่หลากหลาย ไม่ใช่การเก็บนามบัตร อ่านงานของคนที่อยากคุยล่วงหน้า ตกลงกับเพื่อน/อาจารย์ให้ช่วยแนะนำกัน และอย่าจับกลุ่มอยู่แต่กับคนที่รู้จัก (${cite("leininger","Leininger et al., 2021")}; ${cite("compass","COMPASS, 2021")})</p>
<div class="grid2">
<div class="box"><h4>💬 ประโยคเปิด</h4><ul><li>"Hi, I'm ___ from ___. How is the conference going for you?" (${cite("cub","CU Boulder")} เรียกประโยคนี้ว่า "Old Faithful")</li><li>"I really enjoyed your talk on ___. May I ask about ___?"</li><li>"Which talk has been most interesting for you so far?"</li><li>"I noticed your poster uses ___. How did you ___?"</li></ul></div>
<div class="box"><h4>🤝 ระหว่างคุย</h4><ul><li>ถามเรื่องงานเขามากกว่าเล่าเรื่องตัวเอง</li><li>คุย 3–7 นาทีแล้วปิดอย่างสุภาพ</li><li>"May I have your email / connect on LinkedIn?"</li><li>จดชื่อ เรื่องที่คุย และสิ่งที่สัญญาไว้ทันที</li><li>ขออนุญาตก่อนถ่ายรูปหรือบันทึกข้อมูลติดต่อ</li><li>งานสังคม (banquet) ยังเป็นพื้นที่วิชาชีพ</li></ul></div>
</div>
<h3>เครื่องมือสร้าง Elevator Pitch</h3>{{w:pitch}}
<h3>เครื่องมือร่างอีเมล Follow-up</h3>{{w:followup}}`,
`<div class="eyebrow">Stage 4 · Network</div><h2>Networking: target 5 new contacts</h2>
<p>Aim for <b>five meaningful, varied conversations</b>, not a pile of cards. Read the work of people you want to meet, agree with friends/advisors to introduce each other, and don't just huddle with people you know (${cite("leininger","Leininger et al., 2021")}; ${cite("compass","COMPASS, 2021")}).</p>
<div class="grid2">
<div class="box"><h4>💬 Openers</h4><ul><li>"Hi, I'm ___ from ___. How is the conference going for you?" (${cite("cub","CU Boulder")} calls it the "Old Faithful")</li><li>"I really enjoyed your talk on ___. May I ask about ___?"</li><li>"Which talk has been most interesting for you so far?"</li><li>"I noticed your poster uses ___. How did you ___?"</li></ul></div>
<div class="box"><h4>🤝 In conversation</h4><ul><li>Ask about their work more than you talk about yours</li><li>Keep it to 3–7 minutes, close politely</li><li>"May I have your email / connect on LinkedIn?"</li><li>Note name, topic and promises right away</li><li>Ask before taking photos or recording contact details</li><li>Social events (banquets) are still professional spaces</li></ul></div>
</div>
<h3>Elevator pitch builder</h3>{{w:pitch}}
<h3>Follow-up email builder</h3>{{w:followup}}`);

S_("photo","at",{th:"ถ่ายภาพ โซเชียล & มารยาท",en:"Photos, social media & etiquette"},
`<div class="eyebrow">ขั้นที่ 4 · มารยาท</div><h2>ถ่ายภาพ โซเชียลมีเดีย และมารยาท</h2>
<div class="grid2">
<div class="box"><h4>✅ ควรทำ</h4><ul><li>ตรวจนโยบายการถ่ายภาพ/บันทึกของงานก่อนเสมอ (${cite("leininger","Leininger et al., 2021")})</li><li>ขออนุญาตเจ้าของโปสเตอร์ก่อนถ่าย ใช้เพื่อการเรียนรู้</li><li>ให้เพื่อนถ่ายภาพขณะเรานำเสนอ ใช้ใน CV/โปรไฟล์ (${cite("compass","COMPASS, 2021")})</li><li>ตั้งชื่อไฟล์ทันที เช่น <code>D1_RoomA_Talk3.jpg</code></li><li>โพสต์ด้วย hashtag ของงาน ให้เครดิตชื่อผู้พูดและชื่อเรื่อง</li></ul></div>
<div class="box"><h4>⛔ ไม่ควรทำ</h4><ul><li>ถ่าย/โพสต์สไลด์ที่ระบุว่า unpublished หรือ "no photos / no posting"</li><li>ใช้แฟลช ยืนบัง หรืออัดวิดีโอทั้ง talk</li><li>เผยแพร่ข้อมูลที่ยังไม่ตีพิมพ์ของผู้อื่น</li><li>ถ่ายภาพบุคคลระยะใกล้โดยไม่ขออนุญาต</li><li>ปล่อยโทรศัพท์ดังหรือคุยในห้อง</li></ul></div>
</div>
<h3>ช็อตที่ควรมีในรายงาน</h3>
<ul><li>ตัวเองที่ป้ายงาน · ขณะนำเสนอ · โปสเตอร์ดี 2 แผ่น (ได้รับอนุญาต) · บรรยากาศ keynote · บูธ · ภาพกับผู้ติดต่อใหม่ (ได้รับอนุญาต)</li></ul>`,
`<div class="eyebrow">Stage 4 · Etiquette</div><h2>Photos, social media & etiquette</h2>
<div class="grid2">
<div class="box"><h4>✅ Do</h4><ul><li>Check the conference's photo/recording policy first (${cite("leininger","Leininger et al., 2021")})</li><li>Ask poster authors before photographing; use for learning</li><li>Have a friend photograph you presenting, for your CV/profile (${cite("compass","COMPASS, 2021")})</li><li>Rename files right away, e.g. <code>D1_RoomA_Talk3.jpg</code></li><li>Post with the conference hashtag, crediting speaker and title</li></ul></div>
<div class="box"><h4>⛔ Don't</h4><ul><li>Photograph/post slides marked unpublished or "no photos / no posting"</li><li>Use flash, block views, or record whole talks</li><li>Share others' unpublished data</li><li>Take close-up photos of people without permission</li><li>Let your phone ring or chat during talks</li></ul></div>
</div>
<h3>Shots your report should include</h3>
<ul><li>You at the signage · presenting · two good posters (with permission) · keynote atmosphere · booths · you with new contacts (with permission)</li></ul>`);

S_("daily","at",{th:"ทุกวันระหว่างงาน & ดูแลตัวเอง",en:"Daily routine & wellbeing"},
`<div class="eyebrow">ขั้นที่ 4 · ทุกวัน</div><h2>สิ่งที่ทำทุกวัน และการดูแลตัวเอง</h2>{{w:check:daily}}
<div class="note">ความรู้สึก "ไม่เข้าพวก" เป็นเรื่องปกติของการไปงานครั้งแรกและจะง่ายขึ้นเรื่อย ๆ อ่าน code of conduct รู้ช่องทางแจ้งเหตุ งานสังคมยังเป็นพื้นที่วิชาชีพ ไม่ต้องรู้สึกถูกบังคับให้เข้าร่วม และออกจากสถานการณ์ที่ไม่ปลอดภัยทันที (${cite("leininger","Leininger et al., 2021")})</div>`,
`<div class="eyebrow">Stage 4 · Every day</div><h2>Daily routine and looking after yourself</h2>{{w:check:daily}}
<div class="note">Feeling out of place at a first conference is normal and gets easier. Read the code of conduct and know how to report problems; social events remain professional; never feel pressured to join, and leave any unsafe situation (${cite("leininger","Leininger et al., 2021")}).</div>`);

/* ---------- Stage 5: Afterwards ---------- */
S_("after","post",{th:"หลังกลับจากงาน",en:"After the conference"},
`<div class="eyebrow">ขั้นที่ 5 · ปิดงาน</div><h2>หลังกลับจากงาน: ปิดงานให้ครบ</h2>
<p>บันทึกโน้ตและ feedback ทันทีที่กลับ อัปเดต CV ติดต่อผู้ติดต่อใหม่โดยอ้างถึงบทสนทนาจริง และจัดการเอกสารเบิกจ่ายตามกำหนด (${cite("leininger","Leininger et al., 2021")}; ${cite("iu","IU Grademissaries, 2023")}) ก่อนงานครั้งถัดไป 1–2 เดือน ลองทักผู้ติดต่อเดิมเพื่อนัดพบอีกครั้ง (${cite("cub","CU Boulder")})</p>{{w:check:after}}`,
`<div class="eyebrow">Stage 5 · Close the loop</div><h2>After the conference: close the loop</h2>
<p>Record notes and feedback as soon as you return, update your CV, follow up with contacts referencing your actual conversation, and file reimbursements on time (${cite("leininger","Leininger et al., 2021")}; ${cite("iu","IU Grademissaries, 2023")}). A month or two before the next meeting, reach out again to arrange to meet (${cite("cub","CU Boulder")}).</p>{{w:check:after}}`);

S_("mentor","post",{th:"สำหรับอาจารย์ที่ปรึกษา",en:"For advisors"},
`<div class="eyebrow">ภาคผนวก</div><h2>สำหรับอาจารย์ที่ปรึกษา</h2>
<p>ข้อแนะนำสำหรับผู้ดูแล สรุปจาก ${cite("leininger","Leininger et al. (2021)")}:</p>
<ul>
<li>แนะนำงานที่ตรงกับความต้องการของนิสิตแต่ละคน และระวังไม่ให้โอกาสตกอยู่กับเฉพาะคนที่กล้าขอ</li>
<li>ช่วยติดตามกำหนดยื่นทุน และสำรองจ่ายให้ถ้าทำได้</li>
<li>ตรวจแผนการเข้าฟังของนิสิตก่อนไป อธิบายว่าการพักสำคัญ</li>
<li>แนะนำนิสิตให้รู้จักเครือข่ายของอาจารย์ และชี้โปสเตอร์/talk ที่เกี่ยวข้อง</li>
<li>บอกว่าความประหม่าเป็นเรื่องปกติ ให้ช่องทางติดต่อฉุกเฉิน และทบทวน code of conduct</li>
<li>หลังงาน: นัดคุยสรุป (debrief) และช่วยเรื่องเอกสารเบิกจ่าย</li>
</ul>
<h3>ใช้เว็บแอปนี้กับนิสิต</h3>
<ol><li>ไปที่ <b>ส่วนที่ 2 · งานมอบหมาย</b> → กล่อง "สำหรับอาจารย์" กรอกชื่องาน วันที่ สถานที่ เว็บไซต์</li><li>กด "สร้างลิงก์" แล้วส่งลิงก์ให้นิสิต — ข้อมูลงานและกำหนดส่งจะตั้งให้อัตโนมัติ</li><li>นิสิตทำงานในหน้าเว็บ แล้วส่งออกรายงาน (.md หรือ PDF) พร้อมไฟล์ภาพ</li></ol>
<p class="muted">ข้อมูลที่นิสิตกรอกเก็บในเบราว์เซอร์ของนิสิตเท่านั้น ไม่มีการส่งขึ้นเซิร์ฟเวอร์</p>`,
`<div class="eyebrow">Appendix</div><h2>For advisors</h2>
<p>Mentor advice summarised from ${cite("leininger","Leininger et al. (2021)")}:</p>
<ul>
<li>Recommend meetings matched to each student's needs, and make sure opportunities don't go only to those who ask</li>
<li>Help track funding deadlines; cover costs upfront when you can</li>
<li>Review students' plans before the meeting; explain the value of breaks</li>
<li>Introduce students to your network and point out relevant posters/talks</li>
<li>Normalise nervousness, share emergency contacts, review the code of conduct</li>
<li>Afterwards: hold a debrief and help with reimbursement paperwork</li>
</ul>
<h3>Using this web app with students</h3>
<ol><li>Go to <b>Part 2 · Assignments</b> → the "For advisors" box; enter the conference name, dates, venue, website</li><li>Press "Create link" and send it to students — conference details and due dates are set automatically</li><li>Students work on the page and export a report (.md or PDF) with their photos</li></ol>
<p class="muted">Student entries stay in their own browser; nothing is uploaded.</p>`);

function getPath(path){ return path.split(".").reduce((o,k)=> o==null?undefined:o[k], S); }
function setPath(path,val){
  const ks=path.split("."); let o=S;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(o[k]==null) o[k] = /^\d+$/.test(ks[i+1]) ? [] : {}; o=o[k]; }
  o[ks[ks.length-1]]=val;
}
function filled(v){ return v!==undefined && v!==null && String(v).trim()!=="" && v!==false; }

/* ---------- Assignment state helpers ---------- */
function A(id){
  const def = ASSIGN.find(x=>x.id===id);
  S.a[id] = S.a[id] || {f:{},t:{},r:[]};
  const a=S.a[id]; a.f=a.f||{}; a.t=a.t||{}; a.r=a.r||[];
  if(def.repeat) while(a.r.length<def.repeat.min) a.r.push({});
  if(def.skills){ a.sk=a.sk||{pre:{},post:{}}; }
  return a;
}
function itemDone(def,it){
  if(!it) return false;
  const n = def.repeat.fields.filter(f=>f.type!=="check" && f.type!=="score5" && filled(it[f.k])).length;
  return n >= Math.min(3, def.repeat.fields.filter(f=>f.type!=="check"&&f.type!=="score5").length);
}
function asgStats(def){
  const a=A(def.id); let done=0,total=0;
  def.tasks.forEach((_,i)=>{ total++; if(a.t[i]) done++; });
  def.fields.forEach(f=>{ total++; if(filled(a.f[f.k])) done++; });
  if(def.repeat){ total+=def.repeat.min; done+=Math.min(def.repeat.min, a.r.filter(it=>itemDone(def,it)).length); }
  if(def.skills){ total+=2; if(Object.keys(a.sk.pre).length>=SKILLS.length) done++; if(Object.keys(a.sk.post).length>=SKILLS.length) done++; }
  if(def.includePlan){ total++; if(planCount()>=4) done++; }
  return {done,total,pct: total? Math.round(done/total*100):0};
}
function overall(){
  let pts=0,earned=0; ASSIGN.forEach(d=>{ const s=asgStats(d); pts+=d.pts; earned+=d.pts*s.pct/100; });
  return Math.round(earned/pts*100);
}
function planCount(){ return S.myTalks.length; }

/* --- conference days & generic planner --- */
function confDays(){
  const c=S.conf||{}; const out=[];
  const dflt=()=>[1,2,3,4,5].map(i=>({id:"d"+i,label:`${T("วันที่","Day")} ${i}`}));
  if(!c.start) return dflt();
  const s=new Date(c.start+"T00:00:00"); if(isNaN(s)) return dflt();
  let e=c.end?new Date(c.end+"T00:00:00"):new Date(s); if(isNaN(e)||e<s) e=new Date(s);
  for(let d=new Date(s),i=1; d<=e && i<=14; d.setDate(d.getDate()+1),i++){
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    out.push({id:iso,label:`${T("วันที่","Day")} ${i} · ${d.toLocaleDateString(S.lang==="th"?"th-TH":"en-GB",{weekday:"short",day:"numeric",month:"short"})}`}); }
  return out;
}
const dayLabel = id => (confDays().find(d=>d.id===id)||{label:id}).label;
const TYPES = {keynote:{th:"Keynote",en:"Keynote"},talk:{th:"Talk",en:"Talk"},session:{th:"Session",en:"Session"},poster:{th:"โปสเตอร์",en:"Poster"},workshop:{th:"Workshop",en:"Workshop"},booth:{th:"บูธ",en:"Booth"},social:{th:"กิจกรรมสังคม",en:"Social"},break:{th:"พัก",en:"Break"}};
const PRI = {must:{th:"ต้องไป",en:"Must",c:""},should:{th:"ควรไป",en:"Should",c:"gray"},explore:{th:"เปิดโลก",en:"Explore",c:"warn"},backup:{th:"สำรอง",en:"Backup",c:"gray"}};
const toMin = t => { const m=/^(\d{1,2})[:.](\d{2})$/.exec((t||"").trim()); return m? (+m[1])*60+(+m[2]) : null; };
function clashes(){
  const set=new Set(); const items=S.myTalks.map((t,i)=>({t,i,s:toMin(t.start),e:toMin(t.end)})).filter(x=>x.s!==null && x.t.pri!=="backup");
  items.forEach(a=>items.forEach(b=>{ if(a.i<b.i && a.t.day===b.t.day){ const ae=a.e??a.s+15, be=b.e??b.s+15; if(a.s<be && b.s<ae){ set.add(a.i); set.add(b.i);} } }));
  return set;
}

function mySchedule(editable){
  const cl=clashes();
  const rows=S.myTalks.map((t,i)=>Object.assign({i},t)).sort((a,b)=> String(a.day).localeCompare(String(b.day)) || (toMin(a.start)??9999)-(toMin(b.start)??9999));
  if(!rows.length) return editable?`<p class="muted">${T("ยังไม่มีรายการ","Nothing yet")}</p>`:"";
  if(!editable) return rows.map(r=>`- ${dayLabel(r.day)} | ${r.start||""}${r.end?"–"+r.end:""} | ${r.room||""} | ${L(TYPES[r.type])||""}: ${r.title} (${L(PRI[r.pri])||""})`).join("\n");
  let out="", last=null;
  rows.forEach(r=>{
    if(r.day!==last){ if(last!==null) out+=`</tbody></table></div>`; out+=`<h4 style="margin:.8rem 0 .3rem">📅 ${esc(dayLabel(r.day))}</h4><div class="tblwrap"><table><thead><tr><th>${T("เวลา","Time")}</th><th>${T("ห้อง","Room")}</th><th>${T("รายการ","Item")}</th><th></th></tr></thead><tbody>`; last=r.day; }
    const p=PRI[r.pri]||PRI.must; const c=cl.has(r.i);
    out+=`<tr style="${c?"background:#fbefe4":""}"><td style="white-space:nowrap">${esc(r.start)}${r.end?"–"+esc(r.end):""}${c?` <span class="pill warn">${T("ชน","clash")}</span>`:""}</td><td>${esc(r.room)}</td><td><span class="pill gray">${esc(L(TYPES[r.type]))}</span> ${esc(r.title)} <span class="pill ${p.c}">${L(p)}</span></td><td><button class="btn sm danger" data-act="delTalk" data-i="${r.i}">${UI.del[S.lang]}</button></td></tr>`;
  });
  return out+`</tbody></table></div>`;
}

  ok(!/will be (discussed|presented|shown)|จะ(นำเสนอ|อภิปราย)/i.test(body), "ไม่มีผลลัพธ์แบบคลุมเครือ (\"will be discussed\")", "No vague results (\"will be discussed\")");
  ok(!/\(([A-Z][a-z]+(\s+et al\.)?,?\s*\d{4})\)|\[\d+(,\s*\d+)*\]/.test(body), "ไม่มีการอ้างอิงเอกสารในบทคัดย่อ", "No citations in the abstract");
  ok(undefinedAcr.length===0, undefinedAcr.length?`ตัวย่อที่อาจยังไม่นิยาม: ${undefinedAcr.join(", ")}`:"ตัวย่อถูกนิยามแล้ว", undefinedAcr.length?`Possibly undefined acronyms: ${undefinedAcr.join(", ")}`:"Acronyms defined");
  const kws=(a.kw||"").split(/[;,\n]/).map(s=>s.trim()).filter(Boolean);
  const tl=(a.title||"").toLowerCase(); const stem=w=>w.toLowerCase().replace(/(ies|es|s)$/,"");
  const tWords=new Set(tl.split(/[^\p{L}\p{N}-]+/u).filter(w=>w.length>2).map(stem));
  const dup=kws.filter(k=>{ const kl=k.toLowerCase(); if(tl && tl.includes(kl)) return true; const ws=kl.split(/[^\p{L}\p{N}-]+/u).filter(w=>w.length>2); return ws.length>0 && ws.every(w=>tWords.has(stem(w))); });
  ok(kws.length>=3 && kws.length<=6, `keywords ${kws.length} คำ/วลี (มัก 3–6)`, `${kws.length} keywords (usually 3–6)`);
  ok(kws.length>0 && dup.length===0, dup.length?`keywords ซ้ำกับชื่อเรื่อง: ${dup.join(", ")} — เปลี่ยนเป็นคำใหม่เพื่อเพิ่ม visibility`:"keywords ไม่ซ้ำกับชื่อเรื่อง", dup.length?`Keywords repeating the title: ${dup.join(", ")} — use new terms for visibility`:"Keywords don't repeat the title");
  ok(filled(a.authors) && filled(a.affil), "มีรายชื่อผู้แต่งและสังกัด", "Authors and affiliations entered");
  ok(/\*/.test(a.authors||"") && /@/.test(a.email||""), "ระบุ corresponding author (*) และอีเมล", "Corresponding author (*) and email given");
  ok(!!a.advisorOk, "ยืนยันแล้วว่าไม่ตกหล่นชื่อใคร (รวมอาจารย์ที่ปรึกษา)", "Confirmed no one is missing (incl. advisor)");
  return {n,lim,out};
}

  let h=`<section class="card asg" id="${d.id}"><div class="asg-head"><div><div class="eyebrow">${d.id}</div><h2>${d.icon} ${esc(L(d.title))}</h2></div>
  <div style="min-width:140px;text-align:right"><small>${T("ความคืบหน้า","Progress")} <b id="pc-${d.id}">${s.pct}%</b></small><div class="bar"><i id="pb-${d.id}" style="width:${s.pct}%"></i></div></div></div>
  <div class="asg-meta"><span class="pill">${d.pts} ${T("คะแนน","pts")}</span><span class="pill warn" style="white-space:normal">⏰ ${dueHtml(d)}</span><span class="pill gray">${esc(L(d.skill))}</span></div>
  <p><b>${T("เป้าหมาย:","Goal:")}</b> ${esc(L(d.goal))}</p>`;
  if(d.tasks.length) h+=`<ul class="check">${d.tasks.map((t,i)=>`<li class="${a.t[i]?"done":""}"><input type="checkbox" id="t-${d.id}-${i}" data-bind="${p}.t.${i}" ${a.t[i]?"checked":""}><label for="t-${d.id}-${i}"><span>${esc(L(t))}</span></label></li>`).join("")}</ul>`;
  if(d.includePlan) h+=`<div class="box"><b>${T("ตารางจาก Planner","Schedule from the Planner")}</b> <span class="pill">${planCount()}</span><pre class="out" style="margin:.4rem 0">${esc(mySchedule(false)||T("ยังไม่มีรายการ — ไปที่ส่วนที่ 1 › อ่านโปรแกรม & วางตาราง","Nothing yet — go to Part 1 › Program & schedule"))}</pre><button class="btn sm ghost" data-act="goPlanner">${T("เปิด Planner","Open Planner")}</button></div>`;
  if(d.fields.length && d.mode) h+=d.fields.map(f=>inp(`${p}.f.${f.k}`,L(f),f.type,f.opts)).join("");
  if(d.repeat){
    const r=d.repeat; const n=a.r.filter(it=>itemDone(d,it)).length;
    h+=`<h3 style="margin-top:1rem">${esc(L(r.label))} <span class="pill ${n>=r.min?"":"warn"}">${n}/${r.min}${T(" (ขั้นต่ำ)"," (min)")}</span></h3>`;
    a.r.forEach((it,i)=>{
      h+=`<div class="item"><h4>${esc(L(r.label))} ${i+1}${it.name?` · ${esc(it.name)}`:it.title?` · ${esc(it.title)}`:it.code?` · ${esc(it.code)}`:""}</h4>${a.r.length>r.min?`<button class="btn sm danger del" data-act="delItem" data-id="${d.id}" data-i="${i}">${UI.del[S.lang]}</button>`:""}
      <div class="fgrid">${r.fields.filter(f=>f.type!=="textarea").map(f=>`<div>${inp(`${p}.r.${i}.${f.k}`,L(f),f.type,f.opts)}</div>`).join("")}</div>
      ${r.fields.filter(f=>f.type==="textarea").map(f=>inp(`${p}.r.${i}.${f.k}`,L(f),f.type)).join("")}
      ${r.rubric?`<details class="more" ${it.rub?"open":""}><summary>${T("ให้คะแนนตามเกณฑ์ 6 ข้อ","Score with the 6-criterion rubric")}</summary>${rubricBlock(`${p}.r.${i}.rub`)}</details>`:""}</div>`;
    });
    h+=`<button class="btn ghost" data-act="addItem" data-id="${d.id}">${UI.add[S.lang]}</button>`;
  }
  if(d.skills){
    h+=`<h3 style="margin-top:1rem">${T("ประเมินทักษะตนเอง (1 = เริ่มต้น, 5 = มั่นใจมาก)","Skills self-assessment (1 = beginner, 5 = very confident)")}</h3><div class="tblwrap"><table><thead><tr><th>${T("ทักษะ","Skill")}</th><th>${T("ก่อนไป","Before")}</th><th>${T("หลังกลับ","After")}</th></tr></thead><tbody>
    ${SKILLS.map(k=>`<tr><td>${esc(L(k))}</td><td>${scoreBtns(`${p}.sk.pre.${k.k}`)}</td><td>${scoreBtns(`${p}.sk.post.${k.k}`)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if(d.fields.length && !d.mode) h+=d.fields.map(f=>inp(`${p}.f.${f.k}`,L(f),f.type,f.opts)).join("");
  h+=`</section>`;
  return h;
}

/* ---------- Report ---------- */
function report(){
  const st=S.student; const lines=[];
  lines.push(`# ${T("รายงานการเข้าร่วมประชุมวิชาการ","Conference Report")}${S.conf.name?": "+S.conf.name:""}`);
  if(S.conf.start) lines.push(`${T("วันที่จัด","Dates")}: ${fmtDate(new Date(S.conf.start+"T00:00:00"))}${S.conf.end?" – "+fmtDate(new Date(S.conf.end+"T00:00:00")):""}${S.conf.venue?" | "+S.conf.venue:""}`);
  lines.push(`${T("ชื่อ","Name")}: ${st.name||""} | ${T("รหัส","ID")}: ${st.id||""} | ${T("หลักสูตร","Program")}: ${st.program||""}`);
  lines.push(`${T("อาจารย์ที่ปรึกษา","Advisor")}: ${st.advisor||""} | ${T("บทบาท","Role")}: ${st.role||""} ${st.code?"("+st.code+")":""}`);
  lines.push(`${T("ความคืบหน้ารวม","Overall progress")}: ${overall()}% | ${T("วันที่ส่งออก","Exported")}: ${new Date().toLocaleString(S.lang==="th"?"th-TH":"en-GB")}`,"");
  ASSIGN.forEach(d=>{
    const a=A(d.id); const s=asgStats(d);
    lines.push(`## ${d.id} ${L(d.title)} (${d.pts} ${T("คะแนน","pts")}) — ${s.pct}%`); { const dd=dueDate(d); lines.push(`${T("กำหนดส่ง","Due")}: ${L(d.due)}${dd?" ("+fmtDate(dd)+")":""}`); }
    d.tasks.forEach((t,i)=>lines.push(`- [${a.t[i]?"x":" "}] ${L(t)}`));
    if(d.includePlan){ lines.push("",`### ${T("ตารางส่วนตัว","Personal schedule")}`, mySchedule(false)||"-"); }
    d.fields.forEach(f=>{ let v=a.f[f.k]; if(f.type==="select") v=L((f.opts||[]).find(o=>o.v===v))||""; lines.push("",`**${L(f)}**`, filled(v)?String(v):"-"); });
    if(d.repeat){
      a.r.forEach((it,i)=>{
        if(!Object.keys(it).some(k=>filled(it[k]))) return;
        lines.push("",`### ${L(d.repeat.label)} ${i+1}`);
        d.repeat.fields.forEach(f=>{ let v=it[f.k]; if(f.type==="select") v=L((f.opts||[]).find(o=>o.v===v)); if(f.type==="check") v=v?"✔":"✘"; if(filled(v)||f.type==="check") lines.push(`- ${L(f)}: ${v}`); });
        if(it.rub){ const tot=RUBRIC.reduce((s,c)=>s+(it.rub[c.k]||0),0); lines.push(`- ${T("คะแนนเกณฑ์","Rubric")}: ${RUBRIC.map(c=>`${L(c)} ${it.rub[c.k]||"-"}`).join(" · ")} → **${tot}/30**`); }
      });
    }
    if(d.skills){ lines.push("",`### ${T("ประเมินทักษะ (ก่อน → หลัง)","Skills (before → after)")}`); SKILLS.forEach(k=>lines.push(`- ${L(k)}: ${a.sk.pre[k.k]||"-"} → ${a.sk.post[k.k]||"-"}`)); }
    lines.push("");
  });
  return lines.join("\n");
}
function download(name,text,type){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b); const x=document.createElement("a"); x.href=u; x.download=name; document.body.appendChild(x); x.click(); x.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
const fname = ext => `Conference_${(S.student.id||S.student.name||"student").replace(/[^\w฀-๿-]+/g,"_")}.${ext}`;

/* ---------- Render root ---------- */
function render(keepScroll){
  const y=window.scrollY;
  document.documentElement.lang=S.lang; document.body.classList.remove("lang-th","lang-en"); document.body.classList.add("lang-"+S.lang);
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===S.lang));
  document.querySelectorAll(".tabs [data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  $("#tabGuide").textContent=UI.tabGuide[S.lang]; $("#tabAsg").textContent=UI.tabAsg[S.lang];
  $("#brandTitle").textContent=UI.brandTitle[S.lang]; $("#brandSub").textContent=S.conf.name?S.conf.name+(S.conf.start?" · "+fmtDate(new Date(S.conf.start+"T00:00:00")):""):UI.brandSub[S.lang];
  S.tab==="asg" ? renderAsg() : renderGuide();
  if(keepScroll) window.scrollTo(0,y);
}
function refreshLive(){
  const po=$("#pitchOut"); if(po){ po.textContent=pitchText(); const w=pitchText().split(/\s+/).length; const pl=$("#pitchLen"); if(pl) pl.textContent = S.lang==="en" ? `${w} words ≈ ${Math.round(w/2.3)} s` : `${pitchText().length} ${T("ตัวอักษร","chars")}`; }
  const fo=$("#fuOut"); if(fo) fo.textContent=fuText();
  refreshAbs();
  const fo2=$("#fnOut"); if(fo2){ fo2.textContent=fnResult(); const f=S.fn||{}; const bad=/final|สุดท้าย|ล่าสุด|new\b/i.test((f.title||"")+(f.cmt||"")); const thai=/[\u0E00-\u0E7F]/.test((f.title||"")+(f.name||"")); $("#fnWarn").textContent=(bad?T("⚠️ หลีกเลี่ยงคำว่า final / new ในชื่อไฟล์","⚠️ Avoid \"final\" / \"new\" in file names"):"")+(thai?T(" ⚠️ แนะนำใช้อักษรอังกฤษในชื่อไฟล์"," ⚠️ Prefer Latin characters"):""); }
  const bt=$("#budTot"); if(bt) bt.textContent=budTotal().toLocaleString();
  const tl=$("#tLink"); if(tl) tl.textContent=teacherLink();
  if(S.tab==="asg"){
    ASSIGN.forEach(d=>{ const s=asgStats(d); const set=(id,fn)=>{const e=$(id); if(e) fn(e);};
      set("#pc-"+d.id,e=>e.textContent=s.pct+"%"); set("#pb-"+d.id,e=>e.style.width=s.pct+"%"); set("#tb-"+d.id,e=>e.style.width=s.pct+"%"); set("#sp-"+d.id,e=>e.textContent=s.pct+"%"); });
    const ov=overall(); ["#ovTxt","#ovStat"].forEach(id=>{const e=$(id); if(e) e.textContent=ov+"%";}); const ob=$("#ovBar"); if(ob) ob.style.width=ov+"%";
  }
}

/* ---------- Events ---------- */
document.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset.bind) return;
  const v = el.type==="checkbox" ? el.checked : el.value;
  setPath(el.dataset.bind, v); save(); if(el.dataset.rerender) return; refreshLive();
  if(el.type==="checkbox"){ const li=el.closest("li"); if(li) li.classList.toggle("done",v); }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.ck){ S.ck[el.dataset.ck]=el.checked; save(); render(true); return; }
  if(el.dataset.rerender){ render(true); return; }
  if(el.dataset.act==="fillFu" && el.value!==""){ const c=A("A6").r[+el.value]; Object.assign(S.fu,{to:c.name||"",topic:c.topic||"",where:c.where||"",next:c.next||""}); save(); render(true); return; }
  if(el.id==="restoreFile" && el.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d!=="object"||!d.a) throw 0; S=Object.assign(S,d); save(); render(); toast(T("กู้คืนข้อมูลแล้ว","Data restored")); }catch(err){ toast(T("ไฟล์ไม่ถูกต้อง","Invalid file")); } }; r.readAsText(el.files[0]); }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a[data-nav]"); if(!b) return;
  if(b.dataset.lang){ S.lang=b.dataset.lang; save(); render(true); return; }
  if(b.dataset.tab){ S.tab=b.dataset.tab; save(); try{history.replaceState(null,"",S.tab==="asg"?"#assignments":"#guide");}catch(_){} render(); window.scrollTo(0,0); return; }
  if(b.dataset.set){ const cur=getPath(b.dataset.set); const v= b.dataset.sv!==undefined ? b.dataset.sv : +b.dataset.val; setPath(b.dataset.set, cur===v?(typeof v==="string"?"":0):v); save(); render(true); return; }
  if(b.dataset.copy){ const t=$("#"+b.dataset.copy).textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(UI.copied[S.lang])).catch(()=>{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast(UI.copied[S.lang]);}catch(_){} ta.remove(); }); return; }
  const act=b.dataset.act; if(!act) return;
  if(act==="addTalk"){ const title=$("#mt-title").value.trim(); if(!title){ toast(T("กรุณาใส่ชื่อเรื่อง","Please enter a title")); return; }
    const st=$("#mt-start").value.trim(), en=$("#mt-end").value.trim();
    if((st && toMin(st)===null) || (en && toMin(en)===null)){ toast(T("รูปแบบเวลา HH:MM เช่น 09:15","Use HH:MM, e.g. 09:15")); return; }
    S.lastDay=$("#mt-day").value; S.myTalks.push({day:$("#mt-day").value,start:st,end:en,room:$("#mt-room").value.trim(),type:$("#mt-type").value,title,pri:$("#mt-pri").value}); save(); render(true); return; }
  if(act==="delTalk"){ S.myTalks.splice(+b.dataset.i,1); save(); render(true); return; }
  if(act==="ccClear"){ S.cc={}; save(); render(true); return; }
  if(act==="cfpClear"){ S.cfp={}; save(); render(true); return; }
  if(act==="cfpCopy"){ const t=CFP_ROWS.map(([k,l])=>`${L(l)}: ${(S.cfp&&S.cfp[k])||"-"}`).join("\n"); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(UI.copied[S.lang])).catch(()=>{}); return; }
  if(act==="absSup"){ const s=absState(); s.authors=(s.authors||"")+b.dataset.s; save(); render(true); return; }
  if(act==="absEx"){ S.abs=Object.assign({limit:200},EX_ABS); save(); render(true); return; }
  if(act==="absClear"){ S.abs={limit:250}; save(); render(true); return; }
  if(act==="clearRub"){ S.rub={}; save(); render(true); return; }
  if(act==="addItem"){ A(b.dataset.id).r.push({}); save(); render(true); return; }
  if(act==="delItem"){ if(confirmDel()) { A(b.dataset.id).r.splice(+b.dataset.i,1); save(); render(true);} return; }
  if(act==="pitchToA1"){ setPath("a.A1.f.pitch", ((getPath("a.A1.f.pitch")||"")+(getPath("a.A1.f.pitch")?"\n\n":"")+pitchText())); save(); toast(T("ใส่ในงาน A1 แล้ว","Added to A1")); return; }
  if(act==="goPlanner"){ S.tab="guide"; render(); setTimeout(()=>{ const el=$("#program"); if(el) el.scrollIntoView(); },50); return; }
  if(act==="dlMd"){ download(fname("md"), report(), "text/markdown;charset=utf-8"); return; }
  if(act==="print"){ $("#printReport").textContent=report(); document.body.classList.add("pr"); setTimeout(()=>window.print(),50); return; }
  if(act==="backup"){ download(fname("json"), JSON.stringify(S,null,1), "application/json"); return; }
  if(act==="reset"){ if(prompt(T("พิมพ์ RESET เพื่อยืนยันการล้างข้อมูลทั้งหมด","Type RESET to confirm clearing all data"))==="RESET"){ const l=S.lang, c=S.conf; S={lang:l,tab:"asg",ck:{},myTalks:[],rub:{},pitch:{th:{},en:{}},fu:{},student:{},a:{},conf:c}; save(); render(); toast(T("ล้างข้อมูลแล้ว","Cleared")); } return; }
});
// in-page delete of a filled item: avoid native dialogs being blocked in some contexts
function confirmDel(){ try{ return window.confirm(T("ลบรายการนี้?","Remove this entry?")); }catch(e){ return true; } }
window.addEventListener("afterprint",()=>{ document.body.classList.remove("pr"); });

render();
refreshLive();

//<p class="muted">

</script>
